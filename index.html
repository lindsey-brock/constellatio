<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellatio — follow your north star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B1F}
a{color:#EEF1FF}a:hover{color:#F2DFA7}
:focus-visible{outline:2px solid #F2DFA7;outline-offset:3px}
.cs-hero{height:860px}
.cs-copy{align-items:center}
@media (max-width:859px){
.cs-hero{height:1180px}
.cs-copy{align-items:flex-start;padding-top:200px !important}
}
.cs-step{animation:csStepIn 0.9s cubic-bezier(0.22,1,0.36,1) both}
@keyframes csStepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.cs-step{animation:none}}
button:disabled{opacity:0.4;cursor:not-allowed}
.cs-opt{background:transparent}
.cs-opt:hover,.cs-opt:focus-visible{background:rgba(238,241,255,0.08)}
.cs-opt-sel{color:#F2DFA7 !important;background:rgba(242,223,167,0.12) !important}
.cs-list{scrollbar-width:thin;scrollbar-color:rgba(238,241,255,0.25) transparent}
.cs-chip{font:inherit;font-size:14px;color:#EEF1FF;background:transparent;border:1px solid rgba(238,241,255,0.28);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,background .2s,color .2s}
.cs-chip:hover{border-color:rgba(238,241,255,0.6)}
.cs-chip-on,.cs-chip-on:hover{color:#F2DFA7;border-color:#F2DFA7;background:rgba(242,223,167,0.12)}
#cs-role-search::placeholder,#cs-other::placeholder{color:#8F97C0}
#cs-biz::placeholder{color:rgba(242,223,167,0.45)}
#cs-biz:disabled{opacity:0.35}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<section class="cs-hero" onMouseMove="{{onMove}}" style="position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #EEF1FF; background: radial-gradient(ellipse 60% 30% at 18% 100%, rgba(214,128,86,0.38), rgba(214,128,86,0) 70%), linear-gradient(180deg, #060A1C 0%, #0D1440 38%, #232A6A 66%, #43407E 84%, #5E4A70 100%)">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #050919 0%, #0A1036 55%, #0E1546 100%); opacity: {{nightOp}}; transition: opacity 1.8s ease"></div>
<canvas ref="{{backRef}}" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none"></canvas>

<div aria-hidden="{{heroAria}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; visibility: {{heroVis}}">
<header ref="{{nr}}" style="position: absolute; top: 0; left: 0; right: 0; z-index: 2; opacity: {{op4}}; filter: blur({{bl4}}); transition: opacity 0.9s ease, filter 0.9s ease">
<nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #EEF1FF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2DFA7" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2V22M2 12H22M5.5 5.5L18.5 18.5M18.5 5.5L5.5 18.5" stroke-opacity="0.55"></path><path d="M12 6V18M6 12H18"></path></svg>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; letter-spacing: 0.04em">constellatio</span>
</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; font-size: 15px">
<a href="#top" style="text-decoration: none; padding: 10px 0">Approach</a>
<a href="#top" style="text-decoration: none; padding: 10px 0">Work</a>
<a href="#top" style="text-decoration: none; padding: 10px 0">Studio</a>
<a href="#top" style="text-decoration: none; padding: 12px 20px; border: 1px solid rgba(238,241,255,0.35); border-radius: 999px">Start a project</a>
</div>
</nav>
</header>

<div class="cs-copy" style="position: relative; z-index: 1; max-width: 1200px; height: 100%; margin: 0 auto; padding: 0 24px; box-sizing: border-box; display: flex">
<div style="max-width: 560px; display: flex; flex-direction: column; gap: 28px">
<p ref="{{r0}}" style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE; opacity: {{op0}}; filter: blur({{bl0}}); transform: translateY({{ty0}}); transition: opacity 0.9s ease, filter 0.9s ease, transform 0.9s ease">Brand strategy · Identity · Web</p>
<h1 ref="{{r1}}" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(48px, 6.2vw, 92px); line-height: 1; letter-spacing: -0.015em; opacity: {{op1}}; filter: blur({{bl1}}); transform: translateY({{ty1}}); transition: opacity 0.9s ease, filter 0.9s ease, transform 0.9s ease">In a constellation of brands, follow your <em style="font-style: italic; color: {{accent}}">north star.</em></h1>
<p ref="{{r2}}" style="margin: 0; font-size: 19px; line-height: 1.6; color: #D3D8F0; max-width: 480px; opacity: {{op2}}; filter: blur({{bl2}}); transform: translateY({{ty2}}); transition: opacity 0.9s ease, filter 0.9s ease, transform 0.9s ease">Every sky is crowded. Constellatio helps you find the one idea that outshines the rest— then connects the dots into a business strategy to navigate your path.</p>
<div ref="{{r3}}" style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; opacity: {{op3}}; filter: blur({{bl3}}); transform: translateY({{ty3}}); transition: opacity 0.9s ease, filter 0.9s ease, transform 0.9s ease">
<button type="button" onClick="{{findStar}}" style="font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 16px 30px; min-height: 52px; background: {{accent}}; color: #0D1440">Find your north star</button>
<a href="#top" style="font-size: 16px; font-weight: 500; text-decoration: none; padding: 15px 26px; min-height: 52px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(238,241,255,0.35); display: inline-flex; align-items: center">See our constellations</a>
</div>
</div>
</div>
</div>

<div aria-hidden="{{onbAria}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; visibility: {{onbVis}}; opacity: {{onbOp}}; transition: opacity 0.9s ease">
<header>
<div style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px">
<button type="button" onClick="{{goBack}}" style="font: inherit; font-size: 15px; color: #EEF1FF; background: none; border: 1px solid rgba(238,241,255,0.28); border-radius: 999px; padding: 10px 18px 10px 14px; min-height: 44px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#EEF1FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8L10 13"></path></svg>
Back
</button>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; letter-spacing: 0.04em">constellatio</span>
</div>
</header>

<section style="flex: 1 1 auto; display: flex">
<div style="max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 24px 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div aria-hidden="true" style="width: 100%; height: 150px; position: relative; flex: 0 0 auto">
<div ref="{{spotRef}}" style="position: absolute; left: 50%; top: 45%; width: 1px; height: 1px"></div>
</div>

<sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
<div class="cs-step" style="width: 100%; max-width: 720px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">Chart your course</p>
<div style="width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px 16px">
<span id="cs-role-label" style="font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(36px, 3.8vw, 54px); line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap">I am {{article}}</span>
<div onKeyDown="{{onListKey}}" style="position: relative; flex: 1 1 260px; min-width: 0; max-width: 440px; text-align: left">
<button type="button" id="cs-role" ref="{{selectRef}}" onClick="{{toggleList}}" aria-haspopup="listbox" aria-expanded="{{openStr}}" aria-labelledby="cs-role-label cs-role" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(36px, 3.8vw, 54px); line-height: 1.5; color: {{accent}}; background: transparent; border: none; border-bottom: 1px solid rgba(238,241,255,0.4); border-radius: 0; padding: 0 4px 4px 0; cursor: pointer; text-align: left">
<span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{roleText}}</span>
<svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="#EEF1FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; transition: transform 0.2s; transform: {{chevRot}}"><path d="M7 11L14 18L21 11"></path></svg>
</button>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Close the list" tabindex="-1" onClick="{{closeList}}" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: transparent; border: none; cursor: default; z-index: 4"></button>
<div style="position: absolute; left: 0; right: 0; top: calc(100% + 10px); z-index: 5; background: #111948; border: 1px solid rgba(238,241,255,0.14); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; font-style: normal">
<div style="padding: 12px; border-bottom: 1px solid rgba(238,241,255,0.10)">
<label for="cs-role-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search roles</label>
<input id="cs-role-search" ref="{{searchRef}}" type="text" value="{{q}}" onChange="{{onSearch}}" placeholder="Search roles…" autocomplete="off" style="width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; color: #EEF1FF; background: rgba(238,241,255,0.06); border: 1px solid rgba(238,241,255,0.14); border-radius: 10px; padding: 10px 12px; min-height: 44px">
</div>
<div role="listbox" aria-label="Roles" class="cs-list" style="max-height: 300px; overflow-y: auto; padding: 6px">
<sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 12px 12px 4px; font-size: 14px; line-height: 1.5; color: #B9C0DE">No exact match. Pick Other and tell us in your own words.</p>
</sc-if>
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
<div role="group" aria-label="{{grp.label}}">
<div aria-hidden="true" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8F97C0; padding: 12px 12px 6px">{{grp.label}}</div>
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="4">
<button type="button" role="option" aria-selected="{{it.selStr}}" onClick="{{it.pick}}" class="cs-opt {{it.cls}}" style="display: block; width: 100%; box-sizing: border-box; text-align: left; font: inherit; font-size: 15px; color: #EEF1FF; border: none; border-radius: 8px; padding: 11px 12px; min-height: 44px; cursor: pointer">{{it.label}}</button>
</sc-for>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D3D8F0; max-width: 460px">Every constellation begins with a single point of light. Choose the one closest to you.</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<button type="button" disabled="{{noRole}}" onClick="{{next}}" style="font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 16px 32px; min-height: 52px; background: {{accent}}; color: #0D1440">Continue</button>
</div>
</div>
</sc-if>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
<div class="cs-step" style="width: 100%; max-width: 760px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">Name your star</p>
<div style="width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px 16px">
<label for="cs-biz" style="font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(36px, 3.8vw, 54px); line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap">My business is called</label>
<input id="cs-biz" ref="{{bizRef}}" type="text" value="{{biz}}" onChange="{{onBiz}}" disabled="{{noName}}" placeholder="its name" autocomplete="organization" style="flex: 1 1 240px; min-width: 0; max-width: 380px; box-sizing: border-box; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(36px, 3.8vw, 54px); line-height: 1.5; color: {{accent}}; background: transparent; border: none; border-bottom: 1px solid rgba(238,241,255,0.4); border-radius: 0; padding: 0 0 4px; outline-offset: 6px">
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D3D8F0; max-width: 460px">Write it the way you'd want to see it written across the sky.</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 19px; line-height: 1.5; color: {{accent}}">Still searching for it? Every star was unnamed once.</p>
<label style="display: inline-flex; align-items: center; gap: 12px; font-size: 15px; color: #EEF1FF; cursor: pointer; min-height: 44px">
<input type="checkbox" checked="{{noName}}" onChange="{{toggleNoName}}" style="width: 20px; height: 20px; margin: 0; accent-color: {{accent}}; cursor: pointer">
I don't have a name yet. Help me find one.
</label>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<button type="button" disabled="{{bizNotReady}}" onClick="{{next2}}" style="font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 16px 32px; min-height: 52px; background: {{accent}}; color: #0D1440">Continue</button>
</div>
</div>
</sc-if>

<sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
<div class="cs-step" style="width: 100%; max-width: 860px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; margin-top: 16px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">Connect the dots</p>
<h2 id="cs-goals-label" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(36px, 3.8vw, 54px); line-height: 1.15; letter-spacing: -0.01em">I'm navigating toward<em style="font-style: italic; color: {{accent}}">…</em></h2>
<div role="group" aria-labelledby="cs-goals-label" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 860px">
<sc-for list="{{goalItems}}" as="g" hint-placeholder-count="10">
<button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.toggle}}" class="cs-chip {{g.cls}}">
<sc-if value="{{g.on}}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3V21M3 12H21"></path><path d="M6.5 6.5L17.5 17.5M17.5 6.5L6.5 17.5" stroke-opacity="0.5"></path></svg>
</sc-if>
{{g.label}}
</button>
</sc-for>
</div>
<sc-if value="{{otherOn}}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; text-align: left">
<label for="cs-other" style="font-size: 14px; color: #B9C0DE">Tell us about it</label>
<input id="cs-other" type="text" value="{{goalOther}}" onChange="{{onGoalOther}}" placeholder="A few words are plenty" style="font: inherit; font-size: 16px; color: #EEF1FF; background: rgba(238,241,255,0.06); border: 1px solid rgba(238,241,255,0.18); border-radius: 12px; padding: 12px 14px; min-height: 48px; box-sizing: border-box; width: 100%">
</div>
</sc-if>
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.5; color: {{accent}}">Choose as many as you like. Every star adds to the shape.</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<button type="button" disabled="{{goalsNotReady}}" onClick="{{next3}}" style="font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 16px 32px; min-height: 52px; background: {{accent}}; color: #0D1440">Continue</button>
</div>
</div>
</sc-if>

<sc-if value="{{isPackage}}" hint-placeholder-val="{{ false }}">
<div class="cs-step" style="width: 100%; max-width: 760px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; margin-top: 16px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">Your constellation</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(34px, 3.4vw, 48px); line-height: 1.15; letter-spacing: -0.01em">Here's the shape of it{{forName}}<em style="font-style: italic; color: {{accent}}">.</em></h2>
<div style="width: 100%; max-width: 640px; box-sizing: border-box; text-align: left; background: rgba(17,25,72,0.85); border: 1px solid rgba(238,241,255,0.12); border-radius: 20px; padding: 18px 26px 20px">
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); column-gap: 28px">
<sc-for list="{{pkgItems}}" as="p" hint-placeholder-count="3">
<li style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(238,241,255,0.08); font-size: 15px; color: #EEF1FF"><span>{{p.label}}</span><span style="font-family: 'Cormorant Garamond', serif; font-size: 20px; white-space: nowrap">{{p.price}}</span></li>
</sc-for>
</ul>
<sc-if value="{{hasDiscount}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: {{accent}}"><span>Constellation saving, 10% for three or more</span><span style="white-space: nowrap">−{{discount}}</span></div>
</sc-if>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 12px; margin-top: 12px; border-top: 1px solid rgba(238,241,255,0.2)"><span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #B9C0DE">Starting from</span><span style="font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 40px; line-height: 1.05; color: {{accent}}">{{total}}</span></div>
<p style="margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: #8F97C0">Final pricing is confirmed after a short kickoff call. Taxes not included.</p>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 20px">
<button type="button" onClick="{{plantWish}}" style="font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 16px 32px; min-height: 52px; background: {{accent}}; color: #0D1440">Set the course</button>
<button type="button" onClick="{{talkFirst}}" style="font: inherit; font-size: 15px; color: #EEF1FF; background: none; border: none; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; min-height: 44px; padding: 0 6px">I'd rather chart it together first</button>
</div>
</div>
</sc-if>

<sc-if value="{{isPlanted}}" hint-placeholder-val="{{ false }}">
<div class="cs-step" style="width: 100%; max-width: 640px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; margin-top: 16px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">Course set</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(36px, 3.8vw, 54px); line-height: 1.15; letter-spacing: -0.01em">You're on your way<em style="font-style: italic; color: {{accent}}">.</em></h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D3D8F0; max-width: 480px">We'll be in touch within [RESPONSE TIME] to map out the first leg of the journey.</p>
</div>
</sc-if>

<sc-if value="{{isCall}}" hint-placeholder-val="{{ false }}">
<div class="cs-step" style="width: 100%; max-width: 760px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; margin-top: 16px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">Let's plot it together</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(34px, 3.4vw, 48px); line-height: 1.15; letter-spacing: -0.01em">Some courses are best charted together<em style="font-style: italic; color: {{accent}}">.</em></h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #D3D8F0; max-width: 520px">Book a free 30-minute discovery call and we'll map out a constellation around exactly what you need.</p>
<sc-if value="{{hasOtherText}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; line-height: 1.5; color: {{accent}}; max-width: 520px">“{{goalOther}}”</p>
</sc-if>
<div role="group" aria-label="Choose a day" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px">
<sc-for list="{{dayItems}}" as="d" hint-placeholder-count="5">
<button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" class="cs-chip {{d.cls}}">{{d.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Choose a time" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<sc-for list="{{timeItems}}" as="tm" hint-placeholder-count="4">
<button type="button" aria-pressed="{{tm.pressed}}" onClick="{{tm.pick}}" class="cs-chip {{tm.cls}}">{{tm.label}}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #8F97C0">Times are shown in your time zone.</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 20px">
<button type="button" disabled="{{cantBook}}" onClick="{{bookCall}}" style="font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 16px 32px; min-height: 52px; background: {{accent}}; color: #0D1440">Book my call</button>
<sc-if value="{{canSeePackage}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{backToPackage}}" style="font: inherit; font-size: 15px; color: #EEF1FF; background: none; border: none; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; min-height: 44px; padding: 0 6px">Back to my constellation</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isBooked}}" hint-placeholder-val="{{ false }}">
<div class="cs-step" style="width: 100%; max-width: 640px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; margin-top: 16px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B9C0DE">See you under the same sky</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(34px, 3.4vw, 48px); line-height: 1.2; letter-spacing: -0.01em">You're booked for <em style="font-style: italic; color: {{accent}}">{{bookedWhen}}</em>.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D3D8F0; max-width: 480px">A calendar invite is on its way. Bring your questions. We'll bring the star charts.</p>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 32px; font-size: 14px; color: #B9C0DE">
<span>Step {{stepNum}} of 4</span>
<div role="progressbar" aria-label="Onboarding progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="{{stepNum}}" style="width: 240px; height: 3px; border-radius: 3px; background: rgba(238,241,255,0.16); overflow: hidden">
<div style="width: {{progW}}; height: 100%; background: {{accent}}; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1)"></div>
</div>
</div>
</div>
</section>
</div>

<canvas ref="{{fxRef}}" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 6"></canvas>
</section>
</template>
<script>
// ---- Minimal runtime: renders the <template> with the component's values ----
// Supports {{path}} holes, <sc-if value>, <sc-for list as>, on* events and ref.
(function () {
  var ACCENT = "#F2DFA7";

  function DCLogic() {}

  };
  window.DCLogic = DCLogic;

  function lookup(path, scope) {
    path = path.trim();

    for (var i = 0; i < nodes.length; i++) {

  }
  function patch(parent, vnodes) {
    for (var i = 0; i < vnodes.length; i++) {

})();

class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    if (!this._ref) {
      this.textEls = [];
      this._ref = function (el) {
        if (el && el !== self.cv) { self._stop(); self._start(el); }
        else if (!el) { self._stop(); self.cv = null; }
      };
      this._fxRef = function (el) { self.fx = el; if (el) { self.fctx = el.getContext('2d'); if (self.cv) self._resize(); } };
      this._tr = [0, 1, 2, 3, 4].map(function (i) { return function (el) { self.textEls[i] = el; }; });
      this._spotRef = function (el) { self.spot = el; };
      this._find = function () { self._launch(); };
      this._move = function (e) {
        var r = e.currentTarget.getBoundingClientRect();
        if (!r.width) return;
        self.mx = (e.clientX - r.left) / r.width - 0.5;
        self.my = (e.clientY - r.top) / r.height - 0.5;
      };
      // onboarding
      this._selRef = function (el) { self.sel = el; };
      this._searchRef = function (el) { self.searchEl = el; };
      this._bizRef = function (el) { self.bizEl = el; };
      this._toggleList = function () {
        var open = !(self.state && self.state.open);
        self.setState({ open: open, q: '' });
        if (open) setTimeout(function () { if (self.searchEl) { try { self.searchEl.focus({ preventScroll: true }); } catch (e) {} } }, 40);
      };
      this._closeList = function () { self.setState({ open: false }); };
      this._onSearch = function (e) { self.setState({ q: e.target.value }); };
      this._onListKey = function (e) {
        if (e.key === 'Escape' && self.state && self.state.open) {
          self.setState({ open: false });
          if (self.sel) { try { self.sel.focus({ preventScroll: true }); } catch (err) {} }
        }
      };
      this._choose = function (title) {
        self.setState({ role: title, open: false, q: '' });
        if (self.sel) { try { self.sel.focus({ preventScroll: true }); } catch (err) {} }
      };
      this._back = function () {
        var st = (self.state && self.state.step) || 1;
        if (st > 1) { self.setState({ step: st - 1, talk: false, planted: false, booked: false }); return; }
        self._goHome();
      };
      this._next = function () {
        self.setState({ step: 2 });
        setTimeout(function () { if (self.bizEl && !(self.state && self.state.noName)) { try { self.bizEl.focus({ preventScroll: true }); } catch (e) {} } }, 80);
      };
      this._onBiz = function (e) { self.setState({ biz: e.target.value }); };
      this._toggleNoName = function (e) { self.setState({ noName: e.target.checked }); };
      this._next2 = function () {
        var st = self.state || {}, goals = (st.goals || []).slice();
        if (st.noName && goals.indexOf('name') === -1) goals.push('name');
        self.setState({ step: 3, goals: goals });
      };
      this._toggleGoal = function (id) {
        var goals = ((self.state && self.state.goals) || []).slice(), i = goals.indexOf(id);
        if (i === -1) goals.push(id); else goals.splice(i, 1);
        self.setState({ goals: goals });
      };
      this._onGoalOther = function (e) { self.setState({ goalOther: e.target.value }); };
      this._next3 = function () { self.setState({ step: 4, talk: false, planted: false, booked: false }); };
      this._plantWish = function () { self.setState({ planted: true }); };
      this._talkFirst = function () { self.setState({ talk: true }); };
      this._backToPackage = function () { self.setState({ talk: false }); };
      this._bookCall = function () { self.setState({ booked: true }); };
      this._pickDay = function (d) { self.setState({ callDay: d }); };
      this._pickTime = function (t) { self.setState({ callTime: t }); };
    }
    var dis = s.dis || [false, false, false, false, false];
    var role = s.role || '';
    var q = (s.q || '').trim().toLowerCase();
    var groups = [];
    this._roles().forEach(function (g) {
      var items = g[1].filter(function (title) { return g[0] === 'Something else' || !q || title.toLowerCase().indexOf(q) !== -1 || g[0].toLowerCase().indexOf(q) !== -1; })
        .map(function (title) {
          return { label: title, pick: function () { self._choose(title); }, selStr: title === role ? 'true' : 'false', cls: title === role ? 'cs-opt-sel' : '' };
        });

    });
    var pk = this._package(s);
    var v = {
      accent: this.props.accent ?? '#F2DFA7',
      backRef: this._ref,
      fxRef: this._fxRef,
      r0: this._tr[0], r1: this._tr[1], r2: this._tr[2], r3: this._tr[3], nr: this._tr[4],
      spotRef: this._spotRef,
      findStar: this._find,
      onMove: this._move,
      nightOp: s.night ? '1' : '0',
      heroVis: s.heroGone ? 'hidden' : 'visible',
      heroAria: s.onbOn ? 'true' : 'false',
      onbVis: s.onbOn ? 'visible' : 'hidden',
      onbOp: s.onbOn ? '1' : '0',
      onbAria: s.onbOn ? 'false' : 'true',
      goBack: this._back,
      selectRef: this._selRef,
      searchRef: this._searchRef,
      toggleList: this._toggleList,
      closeList: this._closeList,
      onSearch: this._onSearch,
      onListKey: this._onListKey,
      open: !!s.open,
      openStr: s.open ? 'true' : 'false',
      chevRot: s.open ? 'rotate(180deg)' : 'rotate(0deg)',
      roleText: role || 'choose what you do',
      q: s.q || '',
      groups: groups,
      noMatch: !!q && groups.length === 1,
      article: /^[aeiou]/i.test(role) ? 'an' : 'a',
      noRole: !role,
      next: this._next,
      isStep1: (s.step || 1) === 1,
      isStep2: s.step === 2,
      isStep3: s.step === 3,
      stepNum: s.step || 1,
      progW: (s.step || 1) * 25 + '%',
      bizRef: this._bizRef,
      biz: s.biz || '',
      onBiz: this._onBiz,
      noName: !!s.noName,
      toggleNoName: this._toggleNoName,
      bizNotReady: !s.noName && !(s.biz || '').trim(),
      next2: this._next2,
      goalItems: this._goals().map(function (g) {
        var on = (s.goals || []).indexOf(g[0]) !== -1;
        return { label: g[1], on: on, pressed: on ? 'true' : 'false', cls: on ? 'cs-chip-on' : '', toggle: function () { self._toggleGoal(g[0]); } };

      otherOn: (s.goals || []).indexOf('other') !== -1,
      goalOther: s.goalOther || '',
      onGoalOther: this._onGoalOther,
      goalsNotReady: !(s.goals || []).length,
      next3: this._next3,
      isPackage: pk.step4 && !pk.needCall && !s.planted,
      isPlanted: pk.step4 && !pk.needCall && !!s.planted,
      isCall: pk.step4 && pk.needCall && !s.booked,
      isBooked: pk.step4 && pk.needCall && !!s.booked,
      forName: (s.biz || '').trim() && !s.noName ? ', ' + s.biz.trim() : '',
      pkgItems: pk.items,
      hasDiscount: pk.discount > 0,
      discount: pk.fmt(pk.discount),
      total: pk.fmt(pk.total),
      plantWish: this._plantWish,
      talkFirst: this._talkFirst,
      backToPackage: this._backToPackage,
      canSeePackage: !pk.hasOther,
      hasOtherText: pk.hasOther && !!(s.goalOther || '').trim(),
      dayItems: pk.days.map(function (d) { var on = s.callDay === d; return { label: d, pressed: on ? 'true' : 'false', cls: on ? 'cs-chip-on' : '', pick: function () { self._pickDay(d); } }; }),
      timeItems: ['09:30', '11:00', '14:30', '16:00'].map(function (t) { var on = s.callTime === t; return { label: t, pressed: on ? 'true' : 'false', cls: on ? 'cs-chip-on' : '', pick: function () { self._pickTime(t); } }; }),
      cantBook: !(s.callDay && s.callTime),
      bookCall: this._bookCall,
      bookedWhen: (s.callDay || '') + ' at ' + (s.callTime || '')
    };
    for (var i = 0; i < 5; i++) {
      v['op' + i] = dis[i] ? '0' : '1';
      v['bl' + i] = dis[i] ? '10px' : '0px';
      v['ty' + i] = dis[i] ? '-10px' : '0px';
    }
    return v;
  }

  // ---- content: roles, wishes and starting prices (US dollars) ----
  _roles() {
    return [
      ['Food & hospitality', ['Restaurant owner', 'Café owner', 'Baker', 'Chef', 'Caterer', 'Hotelier', 'B&B host', 'Winemaker', 'Brewer']],
      ['Retail & e-commerce', ['Shop owner', 'Online store owner', 'Boutique owner', 'Florist', 'Jewellery designer', 'Fashion designer']],
      ['Health & wellness', ['Therapist', 'Physiotherapist', 'Dentist', 'Doctor in private practice', 'Midwife', 'Nutritionist', 'Yoga teacher', 'Personal trainer']],
      ['Beauty', ['Hair stylist', 'Makeup artist', 'Nail technician', 'Esthetician', 'Spa owner']],
      ['Creative', ['Photographer', 'Illustrator', 'Artist', 'Graphic designer', 'Musician', 'Writer', 'Filmmaker']],
      ['Professional services', ['Lawyer', 'Accountant', 'Consultant', 'Architect', 'Financial advisor', 'Real estate agent', 'Translator']],
      ['Trades & home', ['Electrician', 'Plumber', 'Builder', 'Carpenter', 'Interior designer', 'Landscaper', 'Cleaning business owner']],
      ['Education & coaching', ['Tutor', 'Coach', 'Course creator', 'Language teacher', 'Childcare provider']],
      ['Tech & startups', ['Startup founder', 'Software developer', 'IT consultant', 'App maker']],
      ['Land & makers', ['Farmer', 'Artisan', 'Ceramicist', 'Woodworker', 'Beekeeper']],
      ['Community & events', ['Nonprofit director', 'Community organiser', 'Event planner', 'Wedding planner']],
      ['Something else', ['Other — I\'ll describe it']]
    ];
  }

  _goals() {
    return [
      ['strategy', 'A clear brand strategy'],
      ['name', 'A name that stands out'],
      ['identity', 'A logo & visual identity'],
      ['website', 'A website that guides customers in'],
      ['shop', 'An online shop'],
      ['bookings', 'Online bookings'],
      ['rebrand', 'A fresh new look'],
      ['social', 'Social media that looks the part'],
      ['print', 'Print & packaging'],
      ['other', 'Something else']
    ];
  }

  _prices() {
    return {
      strategy: ['Brand strategy & positioning', 2500],
      name: ['Naming', 1500],
      identity: ['Logo & visual identity', 3500],
      website: ['Website design & build', 7000],
      shop: ['Online shop', 5000],
      bookings: ['Online bookings', 3500],
      rebrand: ['Brand refresh', 3500],
      social: ['Social media kit', 1000],
      print: ['Print & packaging design', 3500]
    };
  }

  _package(s) {
    var prices = this._prices(), goals = s.goals || [];
    var fmt = function (n) { return '$' + Math.round(n).toLocaleString('en-US'); };
    var order = ['strategy', 'name', 'identity', 'website', 'shop', 'bookings', 'rebrand', 'social', 'print'];
    var items = [], sub = 0;
    order.forEach(function (id) {
      if (goals.indexOf(id) !== -1) { items.push({ label: prices[id][0], price: fmt(prices[id][1]) }); sub += prices[id][1]; }
    });
    var discount = items.length >= 3 ? Math.round(sub * 0.1 / 50) * 50 : 0;
    var hasOther = goals.indexOf('other') !== -1;
    var days = [], d = new Date();
    while (days.length < 5) {
      d.setDate(d.getDate() + 1);
      if (d.getDay() !== 0 && d.getDay() !== 6) days.push(d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }));
    }
    return { step4: s.step === 4, items: items, discount: discount, total: sub - discount, fmt: fmt, hasOther: hasOther, needCall: hasOther || !!s.talk, days: days };
  }

  // ---- lifecycle ----
  componentWillUnmount() {
    this._stop();
    this.cv = null;
    (this._timers || []).forEach(function (id) { clearTimeout(id); });
  }

  _later(fn, ms) {
    if (!this._timers) this._timers = [];
    this._timers.push(setTimeout(fn, ms));
  }

  _stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
    if (this.ro) this.ro.disconnect();
    this.ro = null;
  }

  _sprite(r, g, b) {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var x = c.getContext('2d');
    var gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.1, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
    gr.addColorStop(0.28, 'rgba(' + r + ',' + g + ',' + b + ',0.28)');
    gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');

    x.fillRect(0, 0, 64, 64);

  }

  _start(el) {

    this.cv = el;
    this.ctx = el.getContext('2d');

    this.last = this.t0;
    this.mx = this.my = 0;
    this.px = this.py = 0;
    this.meteors = [];
    this.dust = [];
    this.trail = [];
    this.nextMeteor = 6000;
    this.flareAt = -1e9;
    this.K = 0; this.Ktarget = 0;
    this.launched = false;
    this.fly = null;
    this.rest = null;
    if (!this.spr) this.spr = { w: this._sprite(255, 255, 255), b: this._sprite(196, 212, 255), k: this._sprite(255, 214, 170), g: this._sprite(242, 223, 167) };

      this.ro = new ResizeObserver(function () { self._resize(); });
      this.ro.observe(el);

      self._frame(now);
      self.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);

  _resize() {

      var sx0 = W * (this.mob ? 0.3 : 0.2);
      var sg2 = ctx.createRadialGradient(sx0, hz + sink, 0, sx0, hz + sink, W * 0.55);
      sg2.addColorStop(0, 'rgba(255,178,110,0.42)');
      sg2.addColorStop(0.4, 'rgba(240,140,110,0.16)');
      sg2.addColorStop(1, 'rgba(240,140,110,0)');
      ctx.fillStyle = sg2;
      ctx.fillRect(0, hz - W * 0.55 + sink, W, W * 0.55 + H * 0.05);
      var drawRidge = function (pts, fill) {
        ctx.beginPath();
        ctx.moveTo(-10, H + 10);
        for (var r = 0; r < pts.length; r++) ctx.lineTo(pts[r][0] + px * 0.1, pts[r][1] + sink);
        ctx.lineTo(W + 20, H + 10);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
      };
      drawRidge(this.back, '#161634');
      drawRidge(this.front, '#06070F');
      ctx.globalAlpha = 1;
    }

    this._fxFrame(t, dt);
  }

  // the front layer: the shooting star, its stardust and the resting north star
  _fxFrame(t, dt) {
    var fc = this.fctx, W = this.W, H = this.H, spr = this.spr;
    if (!fc) return;
    fc.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    fc.clearRect(0, 0, W, H);
    var head = null, flying = false;

    if (this.fly) {
      var u = Math.max(0, Math.min(1, (t - this.fly.t0) / this.fly.dur));
      if (t >= this.fly.t0) {
        var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        head = this._at(this.fly.path, e);
        flying = true;
        this.trail.push([head[0], head[1]]);
        if (this.trail.length > 26) this.trail.shift();
        if (!this.reduced) {
          var prev = this.trail.length > 1 ? this.trail[this.trail.length - 2] : head;
          var vx = (head[0] - prev[0]) / Math.max(dt, 0.001), vy = (head[1] - prev[1]) / Math.max(dt, 0.001);
          for (var k = 0; k < 7; k++) {
            this.dust.push({
              x: head[0] + (Math.random() - 0.5) * 6, y: head[1] + (Math.random() - 0.5) * 6,
              vx: -vx * 0.04 + (Math.random() - 0.5) * 40, vy: -vy * 0.04 + (Math.random() - 0.5) * 40 + 8,
              age: 0, life: 0.6 + Math.random() * 1.2, size: 0.5 + Math.random() * 1.8,
              c: Math.random() < 0.4 ? 'g' : 'w', ph: Math.random() * 6.28
            });
          }
        }
        // text bursts into stardust as the star passes over it
        if (!this.fly.home) {
          for (var i = 0; i < 4; i++) {
            var el = this.textEls[i];
            if (!el || (this.state && this.state.dis && this.state.dis[i])) continue;
            var r = this._toCanvas(el.getBoundingClientRect()), pad = 30;
            if ((head[0] > r.x - pad && head[0] < r.x + r.w + pad && head[1] > r.y - pad && head[1] < r.y + r.h + pad) || u > 0.82) this._dissolve(i);
          }
          if (u > 0.8) this._dissolve(4);
        }
      } else {
        // the moment before launch: Polaris flares in place
        var P = this.umi[0];
        head = [P.x + this.px, P.y + this.py];
        this._drawStar(fc, head[0], head[1], 1.2 + 0.8 * Math.min(1, (t - this.flareAt) / 300));
      }
      if (u >= 1 && t >= this.fly.t0) {
        var home = this.fly.home;
        this.fly = null;
        this.trail = [];
        if (home) { this.launched = false; this.rest = null; }
        else this._arrive();
      }
    }

    // stardust
    var alive = [];
    for (var n = 0; n < this.dust.length; n++) {
      var p = this.dust[n];
      p.age += dt;
      if (p.age > p.life) continue;
      p.vx *= Math.pow(0.6, dt); p.vy *= Math.pow(0.6, dt);
      p.vy -= 6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      alive.push(p);
      var lifeF = 1 - p.age / p.life;
      var tw = 0.6 + 0.4 * Math.sin(p.ph + t * 0.012);
      var a = Math.min(1, lifeF * 1.4) * tw;
      var sz = p.size * 3.2;
      fc.globalAlpha = a * 0.9;
      fc.drawImage(spr[p.c], p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    this.dust = alive.length > 4000 ? alive.slice(alive.length - 4000) : alive;
    fc.globalAlpha = 1;

    // the shooting star's tail
    if (flying && this.trail.length > 2) {
      fc.lineCap = 'round';
      for (var j = 1; j < this.trail.length; j++) {
        var f = j / this.trail.length;
        fc.beginPath();
        fc.moveTo(this.trail[j - 1][0], this.trail[j - 1][1]);
        fc.lineTo(this.trail[j][0], this.trail[j][1]);
        fc.strokeStyle = 'rgba(255,246,222,' + (f * f * 0.8) + ')';
        fc.lineWidth = 0.6 + f * 3.4;
        fc.stroke();
      }
    }
    if (flying && head) this._drawStar(fc, head[0], head[1], 1.1);

    // resting north star, blinking brighter than the rest
    if (this.launched && !this.fly && this.rest) {
      var since = t;
      var blink = this.reduced ? 0.8 : 0.55 + 0.45 * Math.pow(0.5 + 0.5 * Math.sin(since * 0.0026), 4);
      this._drawStar(fc, this.rest[0], this.rest[1], blink);
    }
  }
}

window.__dcMount(Component);
</script>
